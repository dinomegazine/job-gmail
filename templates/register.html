<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><title>Daftar - GmailJobz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">Daftar Akun Pekerja</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username Baru" required class="w-full p-3 mb-4 bg-gray-700 rounded border border-gray-600">
            <input type="password" name="password" placeholder="Password" required class="w-full p-3 mb-6 bg-gray-700 rounded border border-gray-600">
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 p-3 rounded font-bold transition">Daftar</button>
        </form>
        <p class="text-center mt-4 text-sm text-gray-400">Sudah punya akun? <a href="/auth" class="text-blue-400">Login</a></p>
    </div>
</body>
</html>
