<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><title>Admin Login - GmailJobz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96 border-t-4 border-red-500">
        <h2 class="text-2xl font-bold mb-2 text-center text-red-500">ADMIN ACCESS</h2>
        <p class="text-center text-xs text-gray-400 mb-6">Halaman ini hanya untuk Administrator.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="bg-red-500 text-white p-2 rounded mb-4 text-sm">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Admin Username" required class="w-full p-3 mb-4 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-red-500">
            <input type="password" name="password" placeholder="Admin Password" required class="w-full p-3 mb-6 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-red-500">
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 p-3 rounded font-bold transition">Masuk ke Panel</button>
        </form>
    </div>
</body>
</html>
